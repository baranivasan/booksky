<head>

</head>
<body>
    <input type="text" onkeyup="call()" id="val">
    
    <h1 id="result"></h1>

            var res=document.getElementById("result")
         var val1=document.getElementById("val").value
            // value=val1.value
            res.textContent=val1;
        }
    </script>
</body>
