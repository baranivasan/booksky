<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border: 1px;
        }
        td,th{
            border: 1px solid;
            padding: 2px;
        }
        table,th,td{
            /* border-spacing: 2px; */
            /* border-collapse: collapse; */
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
               <th colspan="4">1</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>2</td>
                <td>3</td>
                <td>4</td>
                <td>5</td>
            </tr>

            <tr>
                <td rowspan="2">6</td>
                <td>7</td>
                <td>8</td>
                <td>9</td>
            </tr>

            <tr>
                <td>10</td>
                <td colspan="2">11</td>
            </tr>
        </tbody>
        
    </table>

    <table>
        <thead>
            <tr>
                <th colspan="2">1</th>
                <th>2</th>
                <th>3</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td colspan="3">4</td>
                <td>5</td>
            </tr>

            <tr>
                <td>6</td>
                <td>7</td>
                <td>8</td>
                <td>9</td>
            </tr>

            <tr>
                <td rowspan="2">10</td>
                <td>11</td>
                <td>12</td>
                <td rowspan="2">13</td>
            </tr>

            <tr>
                <td>14</td>
                <td>15</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
