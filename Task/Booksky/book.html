<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booksky</title>
    <link rel="stylesheet" href="book.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>
<body>

    <div class="navbar">
        <h1>Booksky</h1>
    </div>

    <div class="container">
        <div class="book-container">
            <h2>Rich dad poor dad</h2>
            <h4>Author</h4>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Nisi, fugit! Architecto maxime, aliquid, saepe accusamus illo error in, deleniti eligendi ab suscipit maiores harum facilis itaque incidunt magnam expedita consequatur?</p>
            <button onclick="deletebook(event)" id="delete">Delete</button>
        </div>
    
        
    </div>
    
    <div class="popup" id="popup">
        <div class="addstory" id="add-items">
          <h2>Add Book</h2> 
          <form >
            <input type="text" placeholder="Book title" id="title"> <br>
            <input type="text" placeholder="Book author" id="author"> <br>
            <textarea placeholder="Short discriptoin" id="description"></textarea> <br>
            <button id="add">Add</button>
            <button id="cancel">Cancel</button>
          </form> 
          
        </div>
    </div>
    <button class="add" id="add-popup">+</button>
     
     
    <script src="book.js"></script>
</body>
</html>
